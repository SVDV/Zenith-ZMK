# Diagnostic branch: left half as a dongle-mode peripheral with USB logging and a
# QSPI-flash status report every 10 s. Tests whether the left XIAO's external
# flash fails to initialise (and so never enters deep power-down), which would
# explain its ~385 uA sleep draw. See BATTERY_LOG.md. Do not merge.
include:
  - board: xiao_ble//zmk
    shield: zenith_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZENITH_QSPI_DIAG=y -DCONFIG_FLASH_JESD216_API=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
    artifact-name: zenith_left_qspi_diag
